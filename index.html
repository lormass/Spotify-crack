
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Access | Copy</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #080b09;
    color: white;
    font-family: Arial, sans-serif;
}

.card {
    width: 100%;
    max-width: 420px;
    padding: 35px 28px;
    border: 1px solid #1e3828;
    border-radius: 22px;
    background: linear-gradient(145deg,#151e18,#0c100e);
    box-shadow: 0 0 60px #1ed76012;
    text-align: center;
}

.logo {
    width: 58px;
    height: 58px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: #1ed760;
    display: grid;
    place-items: center;
    color: #071109;
    font-size: 28px;
    font-weight: bold;
}

h1 {
    font-size: 25px;
    margin: 0 0 10px;
}

.description {
    color: #9ba69e;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 25px;
}

.instagram {
    display: inline-block;
    color: #1ed760;
    font-weight: bold;
    text-decoration: none;
    margin-bottom: 25px;
}

button {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 50px;
    background: #1ed760;
    color: #071109;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: #39f579;
    transform: scale(1.02);
}

button:active {
    transform: scale(.98);
}

#status {
    color: #89958d;
    font-size: 12px;
    margin-top: 18px;
}

.footer {
    color: #59645d;
    font-size: 11px;
    margin-top: 30px;
}
</style>
</head>

<body>

<div class="card">
    <div class="logo">♫</div>

    <h1>YOUR ACCESS</h1>

    <p class="description">
        Per ottenere il contenuto esclusivo,
        seguimi su Instagram e torna qui per copiarlo.
    </p>

    <a class="instagram"
       href="https://www.instagram.com/lor.mass/"
       target="_blank">
       @lor.mass ↗
    </a>

    <button onclick="copyText()" id="copyBtn">
        COPIA TESTO
    </button>

    <p id="status">Ready to copy.</p>

    <div class="footer">PERSONAL ACCESS • 2026</div>
</div>

<script>
const TEXT_TO_COPY = `INSERISCI QUI IL TUO TESTO`;

async function copyText() {
    const btn = document.getElementById("copyBtn");
    const status = document.getElementById("status");

    try {
        await navigator.clipboard.writeText(TEXT_TO_COPY);
        btn.textContent = "✓ COPIATO!";
        status.textContent = "Contenuto copiato negli appunti!";
    } catch {
        status.textContent = "Impossibile copiare. Controlla i permessi del browser.";
    }

    setTimeout(() => {
        btn.textContent = "COPIA TESTO";
        status.textContent = "Ready to copy.";
    }, 2500);
}
</script>

</body>
</html>
