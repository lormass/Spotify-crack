
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Copy</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #09090b;
    font-family: Inter, Arial, sans-serif;
    color: white;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 520px;
    padding: 30px;
    background: #151518;
    border: 1px solid #29292e;
    border-radius: 20px;
    box-shadow: 0 20px 60px #0008;
}

h2 {
    font-size: 22px;
    margin-bottom: 8px;
}

.subtitle {
    color: #888891;
    font-size: 13px;
    margin-bottom: 24px;
}

textarea {
    width: 100%;
    min-height: 180px;
    resize: vertical;
    padding: 16px;
    background: #0c0c0f;
    border: 1px solid #303036;
    border-radius: 12px;
    color: white;
    font-size: 14px;
    line-height: 1.6;
    outline: none;
}

textarea:focus {
    border-color: #7777ff;
}

button {
    width: 100%;
    margin-top: 16px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: white;
    color: black;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: #d7d7ff;
    transform: translateY(-2px);
}

button:active {
    transform: scale(.98);
}

.status {
    text-align: center;
    font-size: 12px;
    color: #777;
    margin-top: 14px;
}

</style>
</head>

<body>

<div class="card">
    <h2>Text Copy</h2>
    <p class="subtitle">Inserisci il testo e copialo con un click.</p>

    <textarea id="text" placeholder="Scrivi o incolla qui il tuo testo..."></textarea>

    <button onclick="copyText()" id="copyBtn">
        COPIA TESTO
    </button>

    <p class="status" id="status">Pronto per copiare</p>
</div>

<script>
async function copyText() {
    const text = document.getElementById("text").value;
    const btn = document.getElementById("copyBtn");
    const status = document.getElementById("status");

    if (!text.trim()) {
        status.textContent = "Inserisci prima un testo!";
        return;
    }

    try {
        await navigator.clipboard.writeText(text);
    } catch {
        const textarea = document.getElementById("text");
        textarea.select();
        document.execCommand("copy");
    }

    btn.textContent = "✓ COPIATO!";
    status.textContent = "Testo copiato negli appunti";

    setTimeout(() => {
        btn.textContent = "COPIA TESTO";
        status.textContent = "Pronto per copiare";
    }, 2000);
}
</script>

</body>
</html>
